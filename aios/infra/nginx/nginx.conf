# AIOS / SARVLEKH — Production Nginx Reverse Proxy Configuration
# Target Host: Ubuntu 24.04 on AWS Lightsail Mumbai
# Location: Mounted into container or placed at /etc/nginx/sites-available/aios.conf

# Upstream definitions (Docker bridge network IP assignments)
upstream aios_api {
    server 172.28.0.12:4000;
    # If running Nginx directly on the host VM instead of in Docker Compose, uncomment:
    # server 127.0.0.1:4000;
    keepalive 32;
}

upstream aios_web {
    server 172.28.0.15:3000;
    # If running Nginx directly on the host VM instead of in Docker Compose, uncomment:
    # server 127.0.0.1:3000;
    keepalive 32;
}

# Rate-limiting zones for public auth endpoints (protects against brute-force login attacks)
limit_req_zone $binary_remote_addr zone=auth_ip_limit:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=upload_conn_limit:10m;

# ── HTTP to HTTPS Redirect ──────────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name aios.app *.aios.app; # Replace with registered institute domain

    # ACME challenge for Let's Encrypt / Certbot renewal
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── Production HTTPS Server ─────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name aios.app *.aios.app; # Replace with registered institute domain

    # SSL Certificates (managed via Certbot or custom ACM certs)
    ssl_certificate /etc/letsencrypt/live/aios.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aios.app/privkey.pem;

    # Modern TLS Security Parameters
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Max body size aligned with Fastify 35MB ceiling
    client_max_body_size 35M;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Cloudflare Real IP Restoration (Uncomment if domain DNS proxy is enabled on Cloudflare):
    # IPv4 CIDRs
    # set_real_ip_from 173.245.48.0/20;
    # set_real_ip_from 103.21.244.0/22;
    # set_real_ip_from 103.22.200.0/22;
    # set_real_ip_from 103.31.4.0/22;
    # set_real_ip_from 141.101.64.0/18;
    # set_real_ip_from 108.162.192.0/18;
    # set_real_ip_from 190.93.240.0/20;
    # set_real_ip_from 188.114.96.0/20;
    # set_real_ip_from 197.234.240.0/22;
    # set_real_ip_from 198.41.128.0/17;
    # set_real_ip_from 162.158.0.0/15;
    # set_real_ip_from 104.16.0.0/13;
    # set_real_ip_from 104.24.0.0/14;
    # set_real_ip_from 172.64.0.0/13;
    # set_real_ip_from 131.0.72.0/22;
    # IPv6 CIDRs
    # set_real_ip_from 2400:cb00::/32;
    # set_real_ip_from 2606:4700::/32;
    # set_real_ip_from 2803:f800::/32;
    # set_real_ip_from 2405:b500::/32;
    # set_real_ip_from 2405:8100::/32;
    # set_real_ip_from 2a06:98c0::/29;
    # set_real_ip_from 2c0f:f248::/32;
    # real_ip_header CF-Connecting-IP;
    # real_ip_recursive on;

    # ── 1. Fastify API Upstream ──────────────────────────────────────────────
    location /api/ {
        proxy_pass http://aios_api;
        proxy_http_version 1.1;

        # WebSocket & Keepalive support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Forward real client IP while stripping spoofed client headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # Timeouts for heavy report exports
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 90s;
        proxy_buffering on;
    }

    # ── 2. Rate-limited Public Auth Endpoints ─────────────────────────────────
    location /api/v1/auth/ {
        limit_req zone=auth_ip_limit burst=20 nodelay;

        proxy_pass http://aios_api;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # ── 3. Multipart Upload Concurrency Guard ─────────────────────────────────
    location ~* ^/api/v1/institutes/[^/]+/document-bundles/[^/]+/documents$ {
        # Limit concurrent connections per IP for direct multipart uploads (max 3)
        limit_conn upload_conn_limit 3;

        proxy_pass http://aios_api;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # Disable proxy request buffering for uploads so streams pass directly
        proxy_request_buffering off;
        proxy_read_timeout 120s;
    }

    # ── 4. Next.js Static Asset Caching ──────────────────────────────────────
    location /_next/static/ {
        proxy_pass http://aios_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;

        expires 365d;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ── 5. Next.js Web Frontend (SSR & RSC) ──────────────────────────────────
    location / {
        proxy_pass http://aios_web;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
}
