name: CI

# Per 14-DEPLOYMENT-ARCHITECTURE.md: lint -> typecheck -> test -> build on every PR,
# no direct commits to main/develop. Every commit from here forward is test-gated
# (see docs/33-GAP-ANALYSIS-AND-BUILD-PLAN.md) — this file is intentionally the first
# CI ever added to this repo.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  # prisma generate only needs a syntactically valid URL — no live DB is required
  # to generate clients, only to run migrations (not done in this workflow).
  DATABASE_URL: postgresql://ci:ci@localhost:5432/aios_ci
  # apps/api-python's Settings (src/config.py) requires this to construct at all —
  # even importing the module for a test that never touches auth needs a value here.
  JWT_SECRET: ci-only-placeholder-not-a-real-secret-32-chars

jobs:
  api:
    name: apps/api (NestJS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm --filter @aios/api lint
      - run: pnpm --filter @aios/api typecheck
      - run: pnpm --filter @aios/api test
      - run: pnpm --filter @aios/api build

  web:
    name: apps/web (Next.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm --filter @aios/web lint
      - run: pnpm --filter @aios/web typecheck
      - run: pnpm --filter @aios/web test
      - run: pnpm --filter @aios/web build

  api-python:
    name: apps/api-python (FastAPI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: apps/api-python/requirements-dev.txt
      # The Python Prisma client is generated by the Node CLI (dual-generator schema —
      # see packages/db/prisma/schema.prisma) into this job's Python environment, so
      # both toolchains are needed here even though this job otherwise only runs Python.
      - run: pnpm install --frozen-lockfile
      - run: pip install -r apps/api-python/requirements-dev.txt
      - run: pnpm db:generate
      - working-directory: apps/api-python
        run: ruff check .
      - working-directory: apps/api-python
        run: pytest -q
