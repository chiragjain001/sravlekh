# AIOS / SARVLEKH — Production Docker Compose (Lightsail 4GB Profile)
#
# Optimized for a single 4GB / 2 vCPU VPS (AWS Lightsail Mumbai) hosting:
# - Nginx 1.27 Reverse Proxy (SSL termination, rate-limiting, IP sanitization)
# - Next.js 15 Web Frontend (SSR & RSC)
# - NestJS Fastify API (REST API, Auth, Entitlements)
# - Dedicated Background BullMQ Worker (Grading, OCR, PDF split)
# - Python FastAPI Microservice (PDF rasterization & layout vision)
# - Redis 7 (Cache & BullMQ Broker with durable AOF and noeviction)
#
# Database Topology: External managed Supabase PostgreSQL (AWS Mumbai ap-south-1).
# Total container hard memory limits: 2,432 MB (guaranteeing >1.0 GB physical RAM headroom on 4GB host).
# Total container CPU limits: strictly scheduled with prioritized CPU shares.

services:
  # ── 1. Nginx Reverse Proxy ──────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: aios-prod-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    networks:
      aios-net:
        ipv4_address: 172.28.0.10
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.20"
          memory: 64M
        reservations:
          memory: 32M
    cpu_shares: 1024

  # ── 2. Redis Cache & Job Broker ─────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: aios-prod-redis
    command: [
      "redis-server",
      "--appendonly", "yes",
      "--appendfsync", "everysec",
      "--maxmemory", "128mb",
      "--maxmemory-policy", "noeviction",
      "--protected-mode", "no"
    ]
    volumes:
      - redis_data:/data
    networks:
      aios-net:
        ipv4_address: 172.28.0.11
    deploy:
      resources:
        limits:
          cpus: "0.20"
          memory: 192M
        reservations:
          memory: 64M
    cpu_shares: 1024
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: always

  # ── 3. Fastify NestJS API ──────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    container_name: aios-prod-api
    command: ["node", "dist/main.js"]
    env_file:
      - .env.production
    environment:
      - NODE_ENV=production
      - PORT=4000
      - RUN_WORKERS=false
      - NODE_OPTIONS=--max-old-space-size=384
      - DATABASE_POOL_LIMIT=15
      - DATABASE_POOL_TIMEOUT=20
      - TRUST_PROXY=172.28.0.0/16,127.0.0.1
      - REDIS_URL=redis://172.28.0.11:6379
      - PYTHON_API_URL=http://172.28.0.14:8000
    ports:
      - "127.0.0.1:4000:4000"
    networks:
      aios-net:
        ipv4_address: 172.28.0.12
    deploy:
      resources:
        limits:
          cpus: "0.60"
          memory: 512M
        reservations:
          memory: 256M
    cpu_shares: 1024
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:4000/api/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      redis:
        condition: service_healthy
    restart: always

  # ── 4. Dedicated Background Queue Worker ───────────────────────────────────
  worker:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    container_name: aios-prod-worker
    command: ["node", "dist/worker.js"]
    healthcheck:
      disable: true
    env_file:
      - .env.production
    environment:
      - NODE_ENV=production
      - NODE_OPTIONS=--max-old-space-size=384
      - DATABASE_POOL_LIMIT=10
      - DATABASE_POOL_TIMEOUT=20
      - QUEUE_CONCURRENCY_OCR=1
      - QUEUE_CONCURRENCY_PDF_SPLIT=1
      - QUEUE_CONCURRENCY_AI_EVALUATION=2
      - QUEUE_CONCURRENCY_SCORE_AGGREGATION=2
      - REDIS_URL=redis://172.28.0.11:6379
      - PYTHON_API_URL=http://172.28.0.14:8000
    networks:
      aios-net:
        ipv4_address: 172.28.0.13
    deploy:
      resources:
        limits:
          cpus: "0.40"
          memory: 512M
        reservations:
          memory: 256M
    cpu_shares: 512
    depends_on:
      redis:
        condition: service_healthy
    restart: always

  # ── 5. Python FastAPI Microservice (PDF & Vision) ──────────────────────────
  api-python:
    build:
      context: .
      dockerfile: infra/docker/python.Dockerfile
    container_name: aios-prod-python
    env_file:
      - .env.production
    environment:
      - PYTHONUNBUFFERED=1
      - PORT=8000
    ports:
      - "127.0.0.1:8000:8000"
    networks:
      aios-net:
        ipv4_address: 172.28.0.14
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 768M
        reservations:
          memory: 384M
    cpu_shares: 512
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: always

  # ── 6. Next.js Web Frontend ────────────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    container_name: aios-prod-web
    env_file:
      - .env.production
    environment:
      - NODE_ENV=production
      - PORT=3000
      - NEXT_TELEMETRY_DISABLED=1
      - NODE_OPTIONS=--max-old-space-size=256
      - API_URL=http://172.28.0.12:4000
      - PYTHON_API_URL=http://172.28.0.14:8000
      - NEXT_PUBLIC_API_URL=/api/v1
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      aios-net:
        ipv4_address: 172.28.0.15
    deploy:
      resources:
        limits:
          cpus: "0.40"
          memory: 384M
        reservations:
          memory: 192M
    cpu_shares: 1024
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 25s
    restart: always

volumes:
  redis_data:
    driver: local

networks:
  aios-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
