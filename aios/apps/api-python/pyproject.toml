[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
# Line length is advisory, not blocking — many pre-existing comment lines exceed
# it and rewrapping them isn't worth the churn risk in this pass.
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
